[package]
name = "thinkbrain-notes-desktop"
version = "0.2.0"
description = "Thinkbrain Notes desktop shell"
authors = ["Thinkbrain Notes Contributors"]
edition = "2024"

[lib]
name = "thinkbrain_notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = "2"
gix = { version = "0.86", default-features = false, features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "merge", "worktree-mutation", "max-performance-safe", "index", "status", "credentials", "tree-editor", "revision", "sha1", "attributes", "excludes", "dirwalk", "parallel"] }
flate2 = "1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# Used to percent-decode userinfo in sync destination URLs (e.g.
# `https://user:p%40ss@host/path`). Already pulled in transitively by gix-url,
# declared here so the sync module can depend on it directly.
percent-encoding = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `MoveFileExW(MOVEFILE_REPLACE_EXISTING)` is the only Win32 call used to make
# `write_file_atomically` a true replace-existing operation on Windows. Gated
# to Windows so the mobile (Android) build never pulls it in. Pinned to 0.59,
# the version already locked in `Cargo.lock` by transitive deps (winreg,
# xdg-home), so this declaration resolves to an already-pinned, mature crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# `rustls-platform-verifier` needs a JNI handshake before any TLS connection on
# Android (see `src/android_tls.rs`). It arrives transitively via
# `gix-transport -> reqwest`, but calling its initialiser means depending on it
# directly. `jni` must be 0.22 to match the version that crate builds against —
# Tauri's own Android glue uses 0.21, and the two sets of types are not
# interchangeable.
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
jni = "0.22"
android-native-keyring-store = "1.0.0"
ndk-context = "0.1.1"

# The updater is desktop-only upstream, and this crate also builds for Android.
# Gating it here rather than in `[dependencies]` keeps the mobile build from
# trying to compile a plugin that has no mobile implementation.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"

# keyring v4 split the API (`keyring-core`) from the backends (one crate per
# platform) and moved store selection from a compile-time feature to an
# explicit registration at startup. We depend on the stores directly rather
# than on the `keyring` facade, so each target gets exactly one and the choice
# is visible here instead of buried in feature unification.
[dependencies.keyring-core]
version = "1"

# Linux: the Secret Service, because that is where keyring v3 actually kept
# these secrets. v3's `linux-native-sync-persistent` is a *pair* — keyutils as
# a cache for headless processes, Secret Service for storage that survives a
# reboot. Only the Secret Service half is durable, so it is the half that
# carries existing sign-ins forward.
#
# Verified rather than assumed: a credential written by the shipped v3 build is
# read back by this store, and is NOT found by `linux-keyutils-keyring-store`.
#
# `dbus-`, not `zbus-`: v3's `sync-secret-service` is the blocking libdbus
# crate, and the sync worker calls into this from a plain thread. The zbus
# store reads the same data, but pulls an async runtime into a blocking call
# path for no benefit. `crypto-rust` matches v3's feature set exactly, so no
# new system dependency appears.
#
# Known regression: v4 ships no combined store, so the keyutils cache is gone.
# A headless Linux session with no D-Bus that previously read from the cache
# will now report no credential store instead. Tracked in the migration story.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# macOS only: the `keychain` feature is the legacy file-based store, which is
# exactly where keyring v3 put these secrets. iOS is excluded on purpose — it
# has no legacy keychain and this crate hard-errors there unless `protected` is
# used instead. See src/credential_store.rs.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------

# Dev: prioritize fast compile/test iteration. Line-tables-only debuginfo
# keeps panics/backtraces useful while cutting compile time and artifact size.
[profile.dev]
debug = "line-tables-only"
incremental = true

# Dev dependencies (tauri, rusqlite, serde, etc.): leave at opt-level 0 so
# they compile fast. Override here only if a dep is a runtime hotspot in dev.
[profile.dev.package."*"]
opt-level = 0

# Release: optimized, small binary. Thin LTO gives most of fat LTO's benefit
# at a fraction of the link-time cost (mold further accelerates it).
# codegen-units = 1 maximizes inlining/optimization across the crate.
# strip removes symbol tables for a smaller shipped binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

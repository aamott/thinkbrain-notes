[package]
name = "thinkbrain-notes-desktop"
version = "0.1.0"
description = "Thinkbrain Notes desktop shell"
authors = ["Thinkbrain Notes Contributors"]
edition = "2021"

[lib]
name = "thinkbrain_notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = "1.2"
gix = { version = "0.86", default-features = false, features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "merge", "worktree-mutation", "max-performance-safe", "index", "status", "credentials", "tree-editor", "revision", "sha1", "attributes", "excludes", "dirwalk", "parallel"] }
flate2 = "1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# Used to percent-decode userinfo in sync destination URLs (e.g.
# `https://user:p%40ss@host/path`). Already pulled in transitively by gix-url,
# declared here so the sync module can depend on it directly.
percent-encoding = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The updater is desktop-only upstream, and this crate also builds for Android.
# Gating it here rather than in `[dependencies]` keeps the mobile build from
# trying to compile a plugin that has no mobile implementation.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------

# Dev: prioritize fast compile/test iteration. Line-tables-only debuginfo
# keeps panics/backtraces useful while cutting compile time and artifact size.
[profile.dev]
debug = "line-tables-only"
incremental = true

# Dev dependencies (tauri, rusqlite, serde, etc.): leave at opt-level 0 so
# they compile fast. Override here only if a dep is a runtime hotspot in dev.
[profile.dev.package."*"]
opt-level = 0

# Release: optimized, small binary. Thin LTO gives most of fat LTO's benefit
# at a fraction of the link-time cost (mold further accelerates it).
# codegen-units = 1 maximizes inlining/optimization across the crate.
# strip removes symbol tables for a smaller shipped binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

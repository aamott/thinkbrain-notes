[package]
name = "thinkbrain-notes-desktop"
version = "0.0.0"
description = "Thinkbrain Notes desktop shell"
authors = ["Thinkbrain Notes Contributors"]
edition = "2021"

[lib]
name = "thinkbrain_notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = "1.2"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

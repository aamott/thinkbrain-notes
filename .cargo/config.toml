# Cargo build configuration for ThinkBrain Notes.
#
# Build accelerators (sccache, mold) are NOT hardcoded here. They are enabled
# per-shell by sourcing scripts/rust-env.sh, which autodetects each tool and
# exports the Cargo env vars (RUSTC_WRAPPER, CARGO_TARGET_*_RUSTFLAGS) that
# take precedence over this file. This keeps the committed config clean for
# devs who don't have the tools installed (no benign warnings, no link
# failures) while letting equipped devs opt into faster builds.
#
#   source scripts/rust-env.sh        # enable sccache/mold if present
#   pnpm desktop:tauri dev            # env propagates to tauri-cli's cargo
#
# Tooling (Linux x86_64, optional):
#   - sccache: caches compiled crate artifacts across builds/checkouts.
#   - mold:    high-speed GNU-ld-compatible linker (invoked via clang).
#   - clang:   reliable frontend used to pass `-fuse-ld=mold` to the linker.
#   Install on Ubuntu: `sudo apt install sccache mold clang`.
#   Check sccache hit rate with `sccache --show-stats`.
#
# Profiles live in apps/desktop/src-tauri/Cargo.toml:
#   [profile.dev]    prioritizes compile speed (line-tables-only, incremental).
#   [profile.release] prioritizes runtime speed + small binaries (thin LTO,
#                     codegen-units=1, symbol stripping).

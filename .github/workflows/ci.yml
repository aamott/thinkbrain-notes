name: CI

on:
  push:
  pull_request:

jobs:
  # Node/pnpm job: lint, typecheck, unit tests, Playwright e2e, and build.
  # Failures are surfaced loudly — no `|| true` or `continue-on-error` on any
  # validation step.
  lint-test-build:
    name: Lint, Typecheck, Test, E2E, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm at the exact version pinned in package.json's
      # `packageManager` field so local and CI environments match.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Playwright needs the chromium browser binary (and OS deps) installed
      # before the e2e suite can drive a headless browser on CI.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  # Rust job: runs `cargo test` against the Tauri backend manifest.
  # The project's `.cargo/config.toml` enables sccache (rustc wrapper) and mold
  # (fast linker via clang) for fast local builds. These tools must be present
  # on the runner or cargo fails immediately trying to invoke the wrapper.
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 on Linux links against WebKit2GTK, GTK, libsoup and related
      # system libraries. The build-script crates (glib-sys, gtk-sys,
      # webkit2gtk-sys, ...) invoke pkg-config to locate these; without the
      # `-dev` packages pkg-config cannot find `glib-2.0.pc` and cargo fails.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libc6 \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # sccache caches compiled crate artifacts across CI runs; mold+clang are
      # activated per-shell by scripts/rust-env.sh (sourced in the Cargo test
      # step below) on Linux x86_64.
      - name: Install native build tools (sccache, mold, clang)
        run: sudo apt-get install -y sccache mold clang

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Source the env helper so sccache/mold/clang (installed above) are
      # actually activated — without this, cargo runs with a clean env and the
      # build tools sit unused. Mirrors `scripts/qa.sh` and `pnpm desktop:tauri`.
      - name: Cargo test
        run: |
          source scripts/rust-env.sh
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

name: CI

on:
  push:
  pull_request:

jobs:
  # Node/pnpm job: lint, typecheck, unit tests, Playwright e2e, and build.
  # Failures are surfaced loudly — no `|| true` or `continue-on-error` on any
  # validation step.
  lint-test-build:
    name: Lint, Typecheck, Test, E2E, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm at the exact version pinned in package.json's
      # `packageManager` field so local and CI environments match.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Playwright needs the chromium browser binary (and OS deps) installed
      # before the e2e suite can drive a headless browser on CI.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  # Rust job: runs `cargo test` against the Tauri backend manifest.
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

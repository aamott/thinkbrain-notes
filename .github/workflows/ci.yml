name: CI

on:
  push:
  pull_request:

jobs:
  # Node/pnpm job: lint, typecheck, unit tests, Playwright e2e, and build.
  # Failures are surfaced loudly — no `|| true` or `continue-on-error` on any
  # validation step.
  lint-test-build:
    name: Lint, Typecheck, Test, E2E, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm at the exact version pinned in package.json's
      # `packageManager` field so local and CI environments match.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Playwright needs the chromium browser binary (and OS deps) installed
      # before the e2e suite can drive a headless browser on CI.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  # Rust job: runs `cargo test` against the Tauri backend manifest.
  # The project's `.cargo/config.toml` enables sccache (rustc wrapper) and mold
  # (fast linker via clang) for fast local builds. These tools must be present
  # on the runner or cargo fails immediately trying to invoke the wrapper.
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 on Linux links against WebKit2GTK, GTK, libsoup and related
      # system libraries. The build-script crates (glib-sys, gtk-sys,
      # webkit2gtk-sys, ...) invoke pkg-config to locate these; without the
      # `-dev` packages pkg-config cannot find `glib-2.0.pc` and cargo fails.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libc6 \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # sccache caches compiled crate artifacts across CI runs; mold+clang are
      # activated per-shell by scripts/rust-env.sh (sourced in the Cargo test
      # step below) on Linux x86_64.
      - name: Install native build tools (sccache, mold, clang)
        run: sudo apt-get install -y sccache mold clang

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Source the env helper so sccache/mold/clang (installed above) are
      # actually activated — without this, cargo runs with a clean env and the
      # build tools sit unused. Mirrors `scripts/qa.sh` and `pnpm desktop:tauri`.
      - name: Cargo test
        run: |
          source scripts/rust-env.sh
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # Cross-compile gate for the sync layer.
  #
  # Auto Sync bets on gix specifically because it compiles for Android and iOS,
  # where a system `git` binary does not exist. That bet is only worth anything
  # if it is checked: gix's HTTPS transport pulls in `aws-lc-sys`, a C and
  # assembly BoringSSL fork, so "pure Rust" stops being true at the TLS layer
  # and the mobile toolchains are the only place that shows up.
  #
  # `cargo check` on the `gix` package alone, not the whole crate: Tauri's own
  # mobile build needs an SDK, a linker and a generated project, none of which
  # this gate is asking about. If gix stops cross-compiling, sync stops being
  # portable, and that is worth knowing on the commit that causes it.
  sync-cross-compile:
    name: Sync layer cross-compiles (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            platform: ubuntu-latest
          - target: aarch64-apple-ios
            platform: macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-sys builds C and assembly for the target, so it needs the NDK's
      # cross-compiler. The runner ships one; this points cc-rs at it.
      - name: Point cc at the Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Check gix for the target
        run: |
          cargo check -p gix \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target ${{ matrix.target }}

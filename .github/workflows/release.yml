name: release

# Builds desktop binaries for Linux, macOS (Intel + Arm), and Windows whenever a
# version tag (`v*`) is pushed, then publishes a GitHub Release with the
# artifacts attached. Uses tauri-apps/tauri-action, which reads the app version
# from apps/desktop/src-tauri/tauri.conf.json and builds the bundle targets
# configured there.
#
# Two different signatures are in play, and only one of them exists. Updater
# artifacts are signed with the project's minisign key so an installed app can
# tell a real update from anything else. OS code-signing and notarization are
# not wired up, so macOS and Windows still show the "unidentified developer"
# prompt on first launch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds target both architectures; other platforms build natively.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libc6 \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        # Pinned to v0.6.2 (released 2026-03-14). The @v1 major alias does not
        # resolve in GitHub Actions (tauri-apps/tauri-action#1311), so we pin to
        # an explicit, vetted tag instead of a floating major version.
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. The app only accepts an update signed
          # by the key whose public half is compiled into it
          # (`plugins.updater.pubkey` in tauri.conf.json), so losing this key
          # means no installed copy can ever be updated again — back it up
          # somewhere that is not this repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ThinkBrain Notes ${{ github.ref_name }}"
          releaseBody: |
            A local-first Markdown workspace. Your notes stay ordinary `.md` files on disk, and everything built on top of them — the search index, the link graph, the calendar — is a cache the app can throw away and rebuild.

            ## In this release

            **Editor** — CodeMirror with live preview, wiki-link autocomplete and navigation, and vault-relative images. Writes refuse to overwrite a file that changed underneath them.

            **Explorer** — file tree with full CRUD, multi-window workspaces, and a native watcher that keeps the tree, the open tabs and the index in step with edits made outside the app.

            **Search** — full-text search over the vault or one folder, plus typed filters over frontmatter fields.

            **Journal and calendar** — dated entries as plain notes, filterable by what they record.

            **Themes and settings** — importable themes, and searchable settings with validation, import/export and per-section reset.

            **Extensions** — load one from a local directory; it can contribute panels, editor headers and commands.

            **Updates** — the app checks once at launch and offers to install a newer version. Updates are signed, and only one signed by this project's key is accepted.

            ## Known limits

            - **Binaries are not code-signed.** macOS and Windows will both warn that the developer is unidentified. That is separate from the update signing above, which proves an update came from this project but says nothing to the OS.
            - **Windows is untested.** The file watcher has been exercised by hand on Linux and macOS only, and CI builds Linux alone.
            - **Search results are capped** at 200 matches, and nothing says so when a query matches more.
            - **Installing an update restarts the app** without checking for unsaved edits. Save before accepting one.

            Full notes: [CHANGELOG.md](https://github.com/aamott/thinkbrain-notes/blob/main/CHANGELOG.md)
          releaseDraft: true
          # A tag ending in `-rc`/`-beta`/`-alpha` marks itself as one, so a dry
          # run does not have to look like the real thing.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Label every asset with its OS and architecture so a downloader can
          # tell at a glance which file is theirs. Produces names like
          # `Thinkbrain Notes-0.1.0-macos-aarch64.dmg` and
          # `Thinkbrain Notes-0.1.0-windows-x86_64.exe`. Placeholders are
          # documented in tauri-action's README.
          assetNamePattern: '[name]-[version]-[platform]-[arch][ext]'
          args: ${{ matrix.args }}

name: release

# Builds desktop binaries for Linux, macOS (Intel + Arm), and Windows whenever a
# version tag (`v*`) is pushed, then publishes a GitHub Release with the
# artifacts attached. Uses tauri-apps/tauri-action, which reads the app version
# from apps/desktop/src-tauri/tauri.conf.json and builds the bundle targets
# configured there.
#
# Binaries are unsigned (no code-signing/notarization secrets are wired up yet),
# so macOS/Windows users will see the standard "unidentified developer" prompt.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds target both architectures; other platforms build natively.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libc6 \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        # Pinned to v0.6.2 (released 2026-03-14). The @v1 major alias does not
        # resolve in GitHub Actions (tauri-apps/tauri-action#1311), so we pin to
        # an explicit, vetted tag instead of a floating major version.
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ThinkBrain Notes ${{ github.ref_name }}"
          releaseBody: |
            The first feature-complete local-first knowledge workspace — open Markdown files, zero database lock-in, extensible, cross-platform.

            ## Highlights

            **Markdown editor with live preview** — Full CodeMirror editor with wiki-link autocomplete, clickable `[[links]]`, vault-relative image rendering, and a live preview mode. Save protection guards against losing unsaved edits, and conflict-safe writes refuse to overwrite a file that changed underneath you.

            **Workspace explorer** — VS Code-style file tree with full CRUD, multi-window workspace sessions with MRU tab tracking, show-hidden toggle, and a native file watcher that keeps the tree and open tabs in sync with external edits (VS Code, `git pull`, SyncThing).

            **Extensions platform** — Load extensions from local directories with a manifest, compatibility, and activation lifecycle. Extensions contribute panels, editor headers, and commands through typed contribution points, and get a notes API plus disposable tabs. Ships with a `hello-notes` sample extension pinned by E2E tests.

            **Search & indexing** — Full-text search scoped to folders, backed by a disposable platform-owned index that rebuilds fully from Markdown. Frontmatter metadata facets support typed filter queries over arbitrary fields.

            **Wiki-link foundation** — Platform-agnostic link resolver, reverse-link index, autocomplete, and clickable navigation — the base for backlinks and graph view.

            **Modular themes & settings** — Importable theme files with preset themes and a theme picker. Modular settings system with search, filter, dirty-state validation, import/export, and per-section reset.

            **Journal & calendar** — Journal data model with a frontmatter contract, calendar view, metadata tracking, and entries searchable through the platform index.

            **Cross-platform foundation** — Tauri v2 desktop host (macOS, Windows, Linux) with an ACP agent host runtime, plus an Android scaffold. GitHub Actions CI runs lint, tests, E2E, and Rust tests.

            ---

            Binaries are unsigned. On macOS and Windows you will see the standard "unidentified developer" prompt — see your OS docs to bypass it for now.
          # Published by hand, after the artifacts are looked at.
          #
          # Only one of these four builds — Linux — has ever run in CI, which is
          # `ubuntu-latest` for both of its jobs; the two macOS targets and
          # Windows are exercised nowhere else. A tag that fails on one of them
          # should not leave a half-built release sitting in public, and a tag
          # that succeeds is still worth opening a binary from before anyone
          # else does. Once a release has gone out cleanly this can become
          # `false` and the whole thing can publish itself.
          releaseDraft: true
          # A tag ending in `-rc`/`-beta`/`-alpha` marks itself as one, so a dry
          # run does not have to look like the real thing.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
